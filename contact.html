    <style>
        :root {
            --color-bg: #09090b;
            --color-bg-card: rgba(8, 8, 10, 0.7);
            --color-green: #00ff6a;
            --color-cyan: #00ffff;
            --color-text: #a8d7e7;
            --color-border: #1d2025;
            --color-purple: #c084fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 55px;
            background-color: rgba(28, 36, 38, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-green);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
        }

        .header-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo a {
            color: var(--color-green);
            text-decoration: none;
            font-size: 16px;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav a {
            color: var(--color-green);
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .nav a:hover {
            background-color: rgba(0, 255, 106, 0.1);
        }

        .nav a.active {
            background-color: var(--color-green);
            color: var(--color-bg);
        }

        .nav-icon {
            width: 18px;
            height: 18px;
        }

        .availability {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--color-cyan);
        }

        .availability-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-cyan);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .main {
            padding-top: 100px;
            padding-bottom: 80px;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 40px;
            padding-right: 40px;
        }

        .page-title {
            color: var(--color-green);
            font-size: 12px;
            margin-bottom: 60px;
        }

        .section {
            margin-bottom: 60px;
        }

        .section-title {
            color: var(--color-green);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .section-title::before {
            content: '$ ';
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: var(--color-green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .contact-card {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 25px;
            position: relative;
        }

        .contact-card::before,
        .contact-card::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--color-green);
            border-radius: 50%;
            opacity: 0.5;
        }

        .contact-card::before {
            top: -3px;
            left: -3px;
        }

        .contact-card::after {
            bottom: -3px;
            right: -3px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 255, 106, 0.1);
            border-radius: 4px;
            color: var(--color-green);
        }

        .contact-label {
            color: var(--color-text);
            font-size: 12px;
            opacity: 0.7;
        }

        .contact-value {
            color: var(--color-green);
            font-size: 14px;
        }

        .contact-value a {
            color: var(--color-green);
            text-decoration: none;
        }

        .contact-value a:hover {
            color: var(--color-cyan);
        }

        /* Form */
        .contact-form {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 30px;
            position: relative;
        }

        .contact-form::before,
        .contact-form::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--color-green);
            border-radius: 50%;
            opacity: 0.5;
        }

        .contact-form::before {
            top: -3px;
            left: -3px;
        }

        .contact-form::after {
            bottom: -3px;
            right: -3px;
        }

        .form-title {
            color: var(--color-green);
            font-size: 16px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: var(--color-text);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .form-label::before {
            content: '> ';
            color: var(--color-green);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            color: var(--color-text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--color-green);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background-color: var(--color-green);
            border: 1px solid var(--color-green);
            border-radius: 4px;
            color: var(--color-bg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .form-submit:hover {
            background-color: transparent;
            color: var(--color-green);
        }

        /* Social Links */
        .social-section {
            margin-top: 40px;
        }

        .social-links {
            display: flex;
            gap: 15px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            color: var(--color-green);
            text-decoration: none;
            transition: all 0.2s;
        }

        .social-link:hover {
            background-color: var(--color-green);
            color: var(--color-bg);
            border-color: var(--color-green);
        }

        @media (max-width: 809px) {
            .header {
                padding: 10px 16px;
                height: auto;
                position: relative;
            }

            .header-container {
                flex-direction: column;
                gap: 8px;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                font-size: 12px;
            }

            .nav a {
                padding: 5px 8px;
            }

            .availability {
                font-size: 11px;
            }

            .logo a {
                font-size: 14px;
            }

            .main {
                padding: 20px 16px 60px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 106, 0.03) 2px,
                    rgba(0, 255, 106, 0.03) 4px);
            animation: scanlines 10s linear infinite;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 106, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 106, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .bg-glow {
            position: absolute;
            top: 30%;
            left: 50%;
            width: 1000px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(0, 255, 106, 0.08) 0%, transparent 60%);
            animation: glow-pulse 5s ease-in-out infinite;
        }

        @keyframes glow-pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(0, 255, 106, 0.6);
            border-radius: 50%;
            animation: float-up linear infinite;
            box-shadow: 0 0 8px rgba(0, 255, 106, 0.8);
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }
    </style>
</head>

    <script>
        // Create floating particles
        const bgAnimation = document.querySelector('.bg-animation');
        for (let i = 0; i < 70; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (5 + Math.random() * 8) + 's';
            particle.style.animationDelay = (Math.random() * 6) + 's';
            const size = 2 + Math.random() * 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            bgAnimation.appendChild(particle);
